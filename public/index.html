<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RESET SNS AUTOPILOT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, "Noto Sans JP", sans-serif;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 30px;
    }

    .card {
      background: #151515;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .label {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 260px;
      background: #0d0d0d;
      border: 1px solid #444;
      border-radius: 10px;
      color: white;
      padding: 14px;
      font-size: 15px;
      line-height: 1.7;
      resize: vertical;
      margin-top: 10px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .generate {
      background: #ffffff;
      color: #000000;
    }

    .approve {
      background: #22c55e;
      color: #000000;
    }

    .status {
      display: inline-block;
      background: #222;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      color: #ccc;
      margin-bottom: 20px;
    }

    .footer {
      margin-top: 30px;
      color: #666;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>RESET SNS AUTOPILOT</h1>
    <div class="subtitle">AI × 承認型 SNS 自動運用</div>

    <div class="status" id="status">
      投稿案を生成してください
    </div>

    <div class="card">

      <div class="label">STEP 1</div>
      <h2>AIで投稿案を生成</h2>

      <button
        id="generateBtn"
        class="generate"
        onclick="generatePost()"
      >
        AIで投稿案を生成
      </button>

    </div>

    <div class="card">

      <div class="label">STEP 2</div>
      <h2>投稿内容を確認・編集</h2>

      <textarea
        id="caption"
        placeholder="ここにAIが生成した投稿文が表示されます。生成後に自由に修正できます。"
      ></textarea>

    </div>

    <div class="card">

      <div class="label">STEP 3</div>
      <h2>Instagramへ投稿</h2>

      <button
        id="approveBtn"
        class="approve"
        onclick="approvePost()"
      >
        投稿を承認
      </button>

    </div>

    <div class="footer">
      RESET SNS AUTOPILOT SYSTEM
    </div>

  </div>

  <script>

    async function generatePost() {

      const button = document.getElementById("generateBtn");
      const caption = document.getElementById("caption");
      const status = document.getElementById("status");

      button.disabled = true;
      button.textContent = "AI生成中...";
      status.textContent = "投稿案を生成しています...";

      try {

        const response = await fetch("/api/generate", {
          method: "POST"
        });

        const result = await response.json();

        if (!response.ok) {
          console.error(result);

          alert(
            "投稿案の生成に失敗しました\n\n" +
            JSON.stringify(result, null, 2)
          );

          status.textContent = "生成エラー";
          return;
        }

        caption.value = result.caption;

        status.textContent = "投稿案を生成しました。内容を確認してください。";

      } catch (error) {

        console.error(error);

        alert(
          "投稿案の生成に失敗しました\n\n" +
          error.message
        );

        status.textContent = "生成エラー";

      } finally {

        button.disabled = false;
        button.textContent = "AIで投稿案を生成";

      }
    }


    async function approvePost() {

      const button = document.getElementById("approveBtn");
      const caption = document.getElementById("caption").value.trim();
      const status = document.getElementById("status");

      if (!caption) {
        alert("投稿文がありません。先にAIで投稿案を生成してください。");
        return;
      }

      button.disabled = true;
      button.textContent = "投稿中...";
      status.textContent = "Instagramへ投稿しています...";

      const imageUrl =
        "https://reset-sns-autopilot.vercel.app/reset-plan.png";

      try {

        const response = await fetch("/api/publish", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            imageUrl,
            caption
          })

        });

        const result = await response.json();

        if (!response.ok) {

          console.error(result);

          alert(
            "投稿に失敗しました\n\n" +
            JSON.stringify(result, null, 2)
          );

          status.textContent = "投稿エラー";
          return;
        }

        alert("Instagramへの投稿が完了しました！");

        status.textContent = "Instagram投稿完了";

      } catch (error) {

        console.error(error);

        alert(
          "投稿に失敗しました\n\n" +
          error.message
        );

        status.textContent = "投稿エラー";

      } finally {

        button.disabled = false;
        button.textContent = "投稿を承認";

      }

    }

  </script>

</body>
</html>
