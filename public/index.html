<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESET SNS AUTOPILOT</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #fff;
      font-family: Arial, "Noto Sans JP", sans-serif;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 16px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 25px;
    }

    .card {
      background: #151515;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .label {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 250px;
      background: #0d0d0d;
      color: #fff;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      line-height: 1.7;
      resize: vertical;
    }

    input[type="file"] {
      width: 100%;
      margin-top: 10px;
      color: #fff;
      font-size: 16px;
    }

    #preview {
      display: none;
      width: 100%;
      margin-top: 18px;
      border-radius: 12px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #22c55e;
      color: #000;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      display: inline-block;
      background: #222;
      padding: 7px 12px;
      border-radius: 20px;
      color: #ccc;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .footer {
      color: #666;
      text-align: center;
      font-size: 12px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 14px;
      }

      h1 {
        font-size: 23px;
      }

      .card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>RESET SNS AUTOPILOT</h1>
  <div class="subtitle">Instagram 投稿管理システム</div>

  <div class="status" id="status">
    投稿内容を入力してください
  </div>

  <div class="card">
    <div class="label">STEP 1</div>
    <h2>投稿文</h2>

    <textarea
      id="caption"
      placeholder="Instagramに投稿する文章を入力"
    ></textarea>
  </div>

  <div class="card">
    <div class="label">STEP 2</div>
    <h2>投稿画像</h2>

    <input
      type="file"
      id="imageFile"
      accept="image/jpeg,image/png,image/webp"
    >

    <img id="preview" alt="画像プレビュー">
  </div>

  <div class="card">
    <div class="label">STEP 3</div>
    <h2>投稿を実行</h2>

    <button
      id="publishBtn"
      onclick="publishPost()"
    >
      投稿を承認
    </button>
  </div>

  <div class="footer">
    RESET SNS AUTOPILOT SYSTEM
  </div>

</div>

<script type="module">

  import { upload } from
    "https://esm.sh/@vercel/blob/client";

  const imageFile =
    document.getElementById("imageFile");

  const preview =
    document.getElementById("preview");

  imageFile.addEventListener("change", () => {

    const file = imageFile.files[0];

    if (!file) {
      preview.style.display = "none";
      return;
    }

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";

  });


  window.publishPost = async function () {

    const caption =
      document.getElementById("caption").value.trim();

    const file =
      imageFile.files[0];

    const button =
      document.getElementById("publishBtn");

    const status =
      document.getElementById("status");

    if (!caption) {
      alert("投稿文を入力してください");
      return;
    }

    if (!file) {
      alert("投稿する画像を選択してください");
      return;
    }

    const confirmed = confirm(
      "この内容でInstagramに投稿しますか？"
    );

    if (!confirmed) {
      return;
    }

    button.disabled = true;

    try {

      /* STEP 1：画像アップロード */

      button.textContent = "画像アップロード中...";
      status.textContent = "画像をアップロードしています...";

      const blob = await upload(
        `instagram/${Date.now()}-${file.name}`,
        file,
        {
          access: "public",
          handleUploadUrl: "/api/upload"
        }
      );


      /* STEP 2：Instagram投稿 */

      button.textContent = "Instagram投稿中...";
      status.textContent = "Instagramへ投稿しています...";

      const response = await fetch("/api/publish", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          imageUrl: blob.url,
          caption: caption
        })

      });

      const result = await response.json();

      if (!response.ok) {

        console.error(result);

        alert(
          "Instagram投稿に失敗しました\n\n" +
          JSON.stringify(result, null, 2)
        );

        status.textContent = "投稿エラー";

        return;
      }

      alert("Instagramへの投稿が完了しました！");

      status.textContent = "Instagram投稿完了";

      document.getElementById("caption").value = "";
      imageFile.value = "";

      preview.src = "";
      preview.style.display = "none";

    } catch (error) {

      console.error(error);

      alert(
        "処理に失敗しました\n\n" +
        error.message
      );

      status.textContent = "エラー";

    } finally {

      button.disabled = false;
      button.textContent = "投稿を承認";

    }

  };

</script>

</body>
</html>
