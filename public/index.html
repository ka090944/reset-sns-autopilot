<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESET SNS AUTOPILOT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #fff;
      font-family: Arial, "Noto Sans JP", sans-serif;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 30px;
    }

    .card {
      background: #151515;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .label {
      font-size: 13px;
      color: #999;
      margin-bottom: 8px;
    }

    textarea,
    input {
      width: 100%;
      background: #0d0d0d;
      color: #fff;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
    }

    textarea {
      min-height: 280px;
      line-height: 1.7;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #22c55e;
      color: #000;
    }

    button:disabled {
      opacity: 0.5;
    }

    .status {
      background: #222;
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      color: #ccc;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .footer {
      color: #666;
      text-align: center;
      font-size: 12px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>RESET SNS AUTOPILOT</h1>
  <div class="subtitle">Instagram 投稿管理システム</div>

  <div class="status" id="status">
    投稿内容を入力してください
  </div>

  <div class="card">
    <div class="label">STEP 1</div>
    <h2>投稿文</h2>

    <textarea
      id="caption"
      placeholder="Instagramに投稿する文章を入力"
    ></textarea>
  </div>

  <div class="card">
    <div class="label">STEP 2</div>
    <h2>投稿画像</h2>

    <input
      id="imageUrl"
      type="text"
      value="https://reset-sns-autopilot.vercel.app/reset-plan.png"
      placeholder="画像URL"
    >
  </div>

  <div class="card">
    <div class="label">STEP 3</div>
    <h2>投稿を実行</h2>

    <button
      id="publishBtn"
      onclick="publishPost()"
    >
      投稿を承認
    </button>
  </div>

  <div class="footer">
    RESET SNS AUTOPILOT SYSTEM
  </div>

</div>

<script>

async function publishPost() {

  const caption =
    document.getElementById("caption").value.trim();

  const imageUrl =
    document.getElementById("imageUrl").value.trim();

  const button =
    document.getElementById("publishBtn");

  const status =
    document.getElementById("status");

  if (!caption) {
    alert("投稿文を入力してください");
    return;
  }

  if (!imageUrl) {
    alert("画像URLを入力してください");
    return;
  }

  const confirmed = confirm(
    "この内容でInstagramに投稿しますか？"
  );

  if (!confirmed) {
    return;
  }

  button.disabled = true;
  button.textContent = "投稿中...";

  status.textContent =
    "Instagramへ投稿しています...";

  try {

    const response = await fetch("/api/publish", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        imageUrl,
        caption
      })

    });

    const result = await response.json();

    if (!response.ok) {

      console.error(result);

      alert(
        "投稿に失敗しました\n\n" +
        JSON.stringify(result, null, 2)
      );

      status.textContent = "投稿エラー";

      return;
    }

    alert("Instagramへの投稿が完了しました！");

    status.textContent = "投稿完了";

  } catch (error) {

    console.error(error);

    alert(
      "投稿に失敗しました\n\n" +
      error.message
    );

    status.textContent = "投稿エラー";

  } finally {

    button.disabled = false;
    button.textContent = "投稿を承認";

  }
}

</script>

</body>
</html>
